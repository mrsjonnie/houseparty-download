name: Generate Triple J House Party RSS Feed

on:
  schedule:
    # Run every Saturday at 06:00 UTC (08:00 CEST / 07:00 CET)
    - cron: '0 12 * * 6'
  workflow_dispatch:   # allow manual runs as well

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push commits

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3️⃣ Install system dependencies (ffmpeg)
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # 4️⃣ Install Python dependencies
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 5️⃣ Run the feed generator
      - name: Generate feed & MP3s
        run: |
          python generate_feed.py

      # 🆕 5️⃣.5️⃣ Remove old MP3 files
      - name: Remove old MP3 files
        run: |
          ls -1 docs/mp3/*.mp3 > current_mp3s.txt || true
          if [ -f active_mp3s.txt ]; then
            grep -v -F -f active_mp3s.txt current_mp3s.txt | while read -r file; do
              rm -f "docs/mp3/$file"
            done
          fi

      # 6️⃣ Configure git for committing back
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 7️⃣ Set remote URL for push
      - name: Set remote URL for push
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      # 8️⃣ Commit & push any new/updated/deleted files
      - name: Commit changes
        run: |
          git add docs/feed.xml docs/mp3/ active_mp3s.txt || true
          if ! git diff --cached --quiet; then
            git commit -m "Update House Party feed & MP3s $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No changes to commit"
          fi
